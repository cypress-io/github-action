name: example-basic-pnpm
on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  basic-pnpm:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          # The action is not compatible with Windows used with pnpm due to
          # side effects and compatibility issues
          # introduced with hardening in npm@11.21.2 and npm @12.2.2
          # npm is bundled with Node.js
          # See https://github.com/cypress-io/github-action/issues/1983
          # - windows-2025 # disabled
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

        # See https://github.com/pnpm/action-setup
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

        # See https://github.com/actions/setup-node
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: examples/basic-pnpm/pnpm-lock.yaml

      - name: Cypress tests
        uses: ./ # if copying, replace with cypress-io/github-action@v7
        with:
          package-manager-cache: false
          working-directory: examples/basic-pnpm
          # print information about detected browsers, etc
          # see https://on.cypress.io/command-line#cypress-info
          build: pnpm exec cypress info
