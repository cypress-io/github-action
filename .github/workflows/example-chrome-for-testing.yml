name: example-chrome-for-testing
on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Chrome for Testing
        # Installs from stable channel by default.
        # See https://github.com/browser-actions/setup-chrome for other options.
        # See https://github.com/GoogleChromeLabs/chrome-for-testing for available versions.
        uses: browser-actions/setup-chrome@v2
      - name: Cypress info
        uses: ./ # if copying, replace with cypress-io/github-action@v7
        with:
          # just for full picture after installing Cypress
          # print information about detected browsers, etc
          # see https://on.cypress.io/command-line#cypress-info
          build: npm run info
          working-directory: examples/browser
          browser: chrome-for-testing
